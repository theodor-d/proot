<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valorant Aim Trainer 3D</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1923; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    
    #hud { position: absolute; top: 12px; left: 0; width: 100%; color: #ece8e1; font-size: 14px; font-weight: 700; pointer-events: none; z-index: 10; display: flex; justify-content: space-around; align-items: center; text-shadow: 0 0 6px #000; padding: 0 10px; }
    #dmgText { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); color: #00f0ff; font-weight: bold; font-size: 24px; pointer-events: none; z-index: 12; opacity: 0; transition: opacity 0.2s; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; z-index: 11; }
    #adsOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid rgba(0,240,255,0.4); pointer-events: none; z-index: 9; opacity: 0; transition: opacity 0.15s; }
    
    #msg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; background: rgba(15,25,35,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
    canvas { width: 100vw; height: 100vh; display: block; }

    .github-link { pointer-events: auto; display: flex; align-items: center; gap: 6px; background: rgba(23, 36, 49, 0.8); border: 1px solid #ff4655; color: #ece8e1; text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; transition: all 0.2s; }
    .github-link:hover { background: #ff4655; color: #fff; }
    .github-link svg { fill: currentColor; width: 14px; height: 14px; }

    /* Shop Modal */
    #shop { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 25, 35, 0.95); z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: #ece8e1; }
    #shop h1 { color: #ff4655; margin: 0 0 5px 0; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
    #shop p { margin: 0 0 15px 0; font-size: 13px; color: #a0aab2; }
    .shop-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 95%; max-width: 1100px; max-height: 75vh; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid #2b3e50; }
    .category-title { grid-column: span 6; text-align: left; color: #ffb703; font-size: 14px; font-weight: bold; margin-top: 10px; padding-bottom: 4px; border-bottom: 1px solid #ffb703; text-transform: uppercase; }
    .gun-card { background: #172431; border: 1px solid #2b3e50; border-radius: 6px; padding: 10px; cursor: pointer; transition: all 0.15s; text-align: left; }
    .gun-card:hover { border-color: #ff4655; background: #1f3042; transform: translateY(-2px); }
    .gun-card.active { border-color: #00f0ff; background: #1a3848; }
    .gun-name { color: #fff; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .gun-stat { font-size: 11px; color: #8b9bb4; line-height: 1.3; }
    .gun-stat span { color: #00f0ff; }
  </style>
</head>
<body>
  <div id="hud">
    <div>WEAPON: <span id="wName" style="color:#ff4655;">VANDAL</span></div>
    <div>AMMO: <span id="ammo" style="color:#00f0ff;">25</span>/<span id="maxAmmo">25</span></div>
    <div>SCORE: <span id="score" style="color:#ffb703;">0</span></div>
    <div style="font-size: 12px; color: #8b9bb4;">[WASD] Move | [B] Shop | [K] Lock Mouse | [R] Reload</div>
    <a href="https://github.com/theodor-d/proot/blob/main/vav.html" target="_blank" class="github-link">
      <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </div>

  <div id="dmgText">HEADSHOT 160</div>

  <div id="crosshair">
    <div style="position:absolute; top:6px; left:0; width:4px; height:2px; background:#00ffcc;"></div>
    <div style="position:absolute; top:6px; right:0; width:4px; height:2px; background:#00ffcc;"></div>
    <div style="position:absolute; top:0; left:6px; width:2px; height:4px; background:#00ffcc;"></div>
    <div style="position:absolute; bottom:0; left:6px; width:2px; height:4px; background:#00ffcc;"></div>
  </div>

  <div id="adsOverlay">
    <div style="position:absolute; top:50%; left:0; width:100%; height:1px; background:rgba(0,240,255,0.2);"></div>
    <div style="position:absolute; left:50%; top:0; width:1px; height:100%; background:rgba(0,240,255,0.2);"></div>
  </div>

  <div id="msg">
    <div>CLICK TO LOCK MOUSE & PLAY</div>
    <div style="font-size:14px; color:#8b9bb4; margin-top:8px;">[WASD] Move | [B] Weapon Shop | [K] Lock/Unlock Mouse</div>
  </div>

  <div id="shop">
    <h1>VALORANT ARSENAL</h1>
    <p>Click a weapon to equip | Press [B] or [ESC] to close</p>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
  
  <canvas id="c" tabindex="1"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function() {
    var canvas = document.getElementById('c');
    var msg = document.getElementById('msg');
    var shop = document.getElementById('shop');
    var shopGrid = document.getElementById('shopGrid');
    var wNameEl = document.getElementById('wName');
    var ammoEl = document.getElementById('ammo');
    var maxAmmoEl = document.getElementById('maxAmmo');
    var scoreEl = document.getElementById('score');
    var dmgText = document.getElementById('dmgText');
    var adsOverlay = document.getElementById('adsOverlay');

    var WEAPONS = {
      'classic': { name: 'CLASSIC', cat: 'Sidearm', mag: 12, fireRate: 6.75, headDmg: 78, bodyDmg: 26, hasADS: false, zoom: 1.0, color: 0x888888, modelLen: 0.4 },
      'shorty':  { name: 'SHORTY', cat: 'Sidearm', mag: 2, fireRate: 3.3, headDmg: 22, bodyDmg: 11, hasADS: false, zoom: 1.0, color: 0x666666, modelLen: 0.35 },
      'frenzy':  { name: 'FRENZY', cat: 'Sidearm', mag: 13, fireRate: 10.0, headDmg: 78, bodyDmg: 26, hasADS: false, zoom: 1.0, color: 0x555555, modelLen: 0.4 },
      'ghost':   { name: 'GHOST', cat: 'Sidearm', mag: 15, fireRate: 6.75, headDmg: 105, bodyDmg: 30, hasADS: false, zoom: 1.0, color: 0x777777, modelLen: 0.45 },
      'sheriff': { name: 'SHERIFF', cat: 'Sidearm', mag: 6, fireRate: 4.0, headDmg: 159, bodyDmg: 55, hasADS: false, zoom: 1.0, color: 0xffb703, modelLen: 0.5 },
      'stinger': { name: 'STINGER', cat: 'SMG', mag: 20, fireRate: 16.0, headDmg: 67, bodyDmg: 27, hasADS: true, zoom: 1.15, color: 0x00b4d8, modelLen: 0.55 },
      'spectre': { name: 'SPECTRE', cat: 'SMG', mag: 30, fireRate: 13.3, headDmg: 78, bodyDmg: 26, hasADS: true, zoom: 1.15, color: 0x0077b6, modelLen: 0.6 },
      'bucky':   { name: 'BUCKY', cat: 'Shotgun', mag: 5, fireRate: 1.1, headDmg: 44, bodyDmg: 22, hasADS: false, zoom: 1.0, color: 0x9d4edd, modelLen: 0.7 },
      'judge':   { name: 'JUDGE', cat: 'Shotgun', mag: 7, fireRate: 3.5, headDmg: 34, bodyDmg: 17, hasADS: false, zoom: 1.0, color: 0x7209b7, modelLen: 0.7 },
      'bulldog': { name: 'BULLDOG', cat: 'Rifle', mag: 24, fireRate: 10.0, headDmg: 115, bodyDmg: 35, hasADS: true, zoom: 1.25, color: 0x2a9d8f, modelLen: 0.7 },
      'guardian':{ name: 'GUARDIAN', cat: 'Rifle', mag: 12, fireRate: 5.25, headDmg: 195, bodyDmg: 65, hasADS: true, zoom: 1.5, color: 0xe9c46a, modelLen: 0.8 },
      'phantom': { name: 'PHANTOM', cat: 'Rifle', mag: 30, fireRate: 11.0, headDmg: 156, bodyDmg: 39, hasADS: true, zoom: 1.25, color: 0x00f0ff, modelLen: 0.75 },
      'vandal':  { name: 'VANDAL', cat: 'Rifle', mag: 25, fireRate: 9.75, headDmg: 160, bodyDmg: 40, hasADS: true, zoom: 1.25, color: 0xff4655, modelLen: 0.8 },
      'marshal': { name: 'MARSHAL', cat: 'Sniper', mag: 5, fireRate: 1.5, headDmg: 202, bodyDmg: 101, hasADS: true, zoom: 2.5, color: 0xf4a261, modelLen: 0.85 },
      'outlaw':  { name: 'OUTLAW', cat: 'Sniper', mag: 2, fireRate: 2.75, headDmg: 238, bodyDmg: 140, hasADS: true, zoom: 2.5, color: 0xe76f51, modelLen: 0.85 },
      'operator':{ name: 'OPERATOR', cat: 'Sniper', mag: 5, fireRate: 0.6, headDmg: 255, bodyDmg: 150, hasADS: true, zoom: 2.5, color: 0xd62828, modelLen: 0.9 },
      'ares':    { name: 'ARES', cat: 'Heavy', mag: 50, fireRate: 13.0, headDmg: 72, bodyDmg: 30, hasADS: true, zoom: 1.25, color: 0x48cae4, modelLen: 0.85 },
      'odin':    { name: 'ODIN', cat: 'Heavy', mag: 100, fireRate: 15.6, headDmg: 95, bodyDmg: 38, hasADS: true, zoom: 1.25, color: 0x023e8a, modelLen: 0.9 }
    };

    var currentWkey = 'vandal';
    var curW = WEAPONS[currentWkey];
    var ammo = curW.mag;
    var score = 0;
    var playing = false;
    var isADS = false;
    var lastShotTime = 0;
    var isReloading = false;
    var shopOpen = false;

    // Movement controls state
    var moveKeys = { forward: false, backward: false, left: false, right: false };

    function buildShopUI() {
      shopGrid.innerHTML = '';
      var categories = ['Sidearm', 'SMG', 'Shotgun', 'Rifle', 'Sniper', 'Heavy'];

      categories.forEach(function(cat) {
        var title = document.createElement('div');
        title.className = 'category-title';
        title.innerText = cat + 's';
        shopGrid.appendChild(title);

        Object.keys(WEAPONS).forEach(function(key) {
          var w = WEAPONS[key];
          if (w.cat === cat) {
            var card = document.createElement('div');
            card.className = 'gun-card' + (key === currentWkey ? ' active' : '');
            card.innerHTML = 
              '<div class="gun-name">' + w.name + '</div>' +
              '<div class="gun-stat">Head: <span>' + w.headDmg + '</span></div>' +
              '<div class="gun-stat">Body: <span>' + w.bodyDmg + '</span></div>' +
              '<div class="gun-stat">Mag: <span>' + w.mag + '</span></div>' +
              '<div class="gun-stat">Fire Rate: <span>' + w.fireRate + '</span></div>';

            card.addEventListener('click', function() {
              equipWeapon(key);
              toggleShop(false);
              canvas.requestPointerLock();
            });
            shopGrid.appendChild(card);
          }
        });
      });
    }

    function equipWeapon(key) {
      currentWkey = key;
      curW = WEAPONS[currentWkey];
      ammo = curW.mag;
      wNameEl.innerText = curW.name;
      wNameEl.style.color = '#' + curW.color.toString(16);
      ammoEl.innerText = ammo;
      maxAmmoEl.innerText = curW.mag;
      if (isADS) toggleADS(false);
      buildGunMesh();
      buildShopUI();
    }

    function toggleShop(state) {
      shopOpen = (state !== undefined) ? state : !shopOpen;
      shop.style.display = shopOpen ? 'flex' : 'none';
      if (shopOpen && document.pointerLockElement === canvas) {
        document.exitPointerLock();
      }
    }

    buildShopUI();

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1923);
    scene.fog = new THREE.FogExp2(0x0f1923, 0.018);

    var baseFov = 70;
    var camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5); // Default player spawn

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    var grid = new THREE.GridHelper(100, 40, 0xff4655, 0x223242);
    grid.position.y = -1.5;
    scene.add(grid);

    var wallGeo = new THREE.PlaneGeometry(80, 25);
    var wallMat = new THREE.MeshBasicMaterial({ color: 0x172431, side: THREE.DoubleSide });
    var wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(0, 10, -28);
    scene.add(wall);

    var ambient = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambient);

    var gunGroup = new THREE.Group();
    var gunMesh;
    
    function buildGunMesh() {
      if (gunMesh) gunGroup.remove(gunMesh);
      var g = new THREE.Group();
      var bodyGeo = new THREE.BoxGeometry(0.12, 0.18, curW.modelLen);
      var bodyMat = new THREE.MeshBasicMaterial({ color: curW.color, wireframe: true });
      var body = new THREE.Mesh(bodyGeo, bodyMat);

      var barrelMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 0.4),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      barrelMesh.rotation.x = Math.PI / 2;
      barrelMesh.position.set(0, 0.04, -curW.modelLen / 2 - 0.2);

      g.add(body);
      g.add(barrelMesh);
      gunMesh = g;
      gunGroup.add(gunMesh);
    }
    
    buildGunMesh();
    gunGroup.position.set(0.35, -0.32, -0.6);
    camera.add(gunGroup);
    scene.add(camera);

    // Bot Creation with 150 HP System
    var targets = [];
    function createBot() {
      var botGroup = new THREE.Group();

      var bodyGeo = new THREE.CylinderGeometry(0.4, 0.3, 1.4, 8);
      var bodyMat = new THREE.MeshBasicMaterial({ color: 0x2b3e50 });
      var body = new THREE.Mesh(bodyGeo, bodyMat);
      body.userData = { type: 'body' };
      botGroup.add(body);

      var headGeo = new THREE.SphereGeometry(0.3, 12, 12);
      var headMat = new THREE.MeshBasicMaterial({ color: 0xff4655 });
      var head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.0;
      head.userData = { type: 'head' };
      botGroup.add(head);

      // Health Bar Mesh
      var hpBgGeo = new THREE.PlaneGeometry(1.0, 0.12);
      var hpBgMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
      var hpBg = new THREE.Mesh(hpBgGeo, hpBgMat);
      hpBg.position.set(0, 1.6, 0);

      var hpBarGeo = new THREE.PlaneGeometry(0.96, 0.08);
      var hpBarMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
      var hpBar = new THREE.Mesh(hpBarGeo, hpBarMat);
      hpBar.position.set(0, 1.6, 0.01);

      botGroup.add(hpBg);
      botGroup.add(hpBar);

      var x = (Math.random() - 0.5) * 22;
      var z = -8 - Math.random() * 14;
      botGroup.position.set(x, 0, z);

      scene.add(botGroup);
      targets.push({ 
        group: botGroup, 
        head: head, 
        body: body, 
        hpBar: hpBar,
        hp: 150, 
        maxHp: 150,
        dir: Math.random() > 0.5 ? 1 : -1 
      });
    }

    for (var i = 0; i < 6; i++) createBot();

    var yaw = 0, pitch = 0;
    
    function lockChange() {
      if (document.pointerLockElement === canvas) {
        playing = true;
        msg.style.display = 'none';
        if (shopOpen) toggleShop(false);
      } else {
        playing = false;
        if (!shopOpen) {
          msg.style.display = 'flex';
        }
      }
    }
    document.addEventListener('pointerlockchange', lockChange);

    function requestLock() {
      canvas.focus();
      canvas.requestPointerLock();
    }

    msg.addEventListener('click', requestLock);
    canvas.addEventListener('click', function() { 
      if (!playing && !shopOpen) requestLock(); 
    });

    document.addEventListener('mousemove', function(e) {
      if (!playing || shopOpen) return;
      var sens = isADS ? 0.0012 : 0.0022;
      yaw -= e.movementX * sens;
      pitch -= e.movementY * sens;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
    });

    // WASD & Key Listeners
    window.addEventListener('keydown', function(e) {
      if (e.code === 'KeyB') {
        toggleShop();
        return;
      }

      if (e.code === 'KeyK') {
        if (document.pointerLockElement === canvas) {
          document.exitPointerLock();
        } else {
          requestLock();
        }
        return;
      }

      if (e.code === 'Escape' && shopOpen) {
        toggleShop(false);
        return;
      }

      if (!playing || shopOpen) return;

      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveKeys.forward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveKeys.backward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveKeys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveKeys.right = true;

      if (e.key === '1') equipWeapon('vandal');
      if (e.key === '2') equipWeapon('phantom');
      if (e.key === '3') equipWeapon('sheriff');
      if (e.key === '4') equipWeapon('operator');

      if (e.code === 'KeyR' && !isReloading && ammo < curW.mag) {
        isReloading = true;
        wNameEl.innerText = 'RELOADING...';
        setTimeout(function() {
          ammo = curW.mag;
          ammoEl.innerText = ammo;
          wNameEl.innerText = curW.name;
          isReloading = false;
        }, 1200);
      }
    });

    window.addEventListener('keyup', function(e) {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveKeys.forward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveKeys.backward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveKeys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveKeys.right = false;
    });

    function toggleADS(state) {
      if (!curW.hasADS && state) return;
      isADS = state;
      adsOverlay.style.opacity = isADS ? '1' : '0';
      camera.fov = isADS ? baseFov / curW.zoom : baseFov;
      camera.updateProjectionMatrix();
    }

    document.addEventListener('mousedown', function(e) {
      if (!playing || shopOpen) return;
      if (e.button === 2) toggleADS(!isADS);
    });

    window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    var raycaster = new THREE.Raycaster();
    var isFiring = false;

    document.addEventListener('mousedown', function(e) { 
      if (e.button === 0 && playing && !shopOpen) isFiring = true; 
    });
    document.addEventListener('mouseup', function(e) { 
      if (e.button === 0) isFiring = false; 
    });

    function shoot() {
      var now = performance.now();
      if (now - lastShotTime < (1000 / curW.fireRate)) return;
      if (ammo <= 0 || isReloading) return;

      lastShotTime = now;
      ammo--;
      ammoEl.innerText = ammo;

      gunGroup.position.z = isADS ? -0.3 : -0.4;
      gunGroup.position.y = isADS ? -0.12 : -0.28;

      var spread = isADS ? 0.003 : 0.012;
      var rx = (Math.random() - 0.5) * spread;
      var ry = (Math.random() - 0.5) * spread;

      raycaster.setFromCamera(new THREE.Vector2(rx, ry), camera);

      var clickableObjs = [];
      targets.forEach(function(t) { clickableObjs.push(t.head, t.body); });

      var hits = raycaster.intersectObjects(clickableObjs);

      if (hits.length > 0) {
        var hitObj = hits[0].object;
        var isHead = hitObj.userData.type === 'head';
        var damage = isHead ? curW.headDmg : curW.bodyDmg;

        dmgText.innerText = (isHead ? 'HEADSHOT ' : 'BODY HIT ') + damage;
        dmgText.style.color = isHead ? '#ff4655' : '#00f0ff';
        dmgText.style.opacity = '1';
        setTimeout(function() { dmgText.style.opacity = '0'; }, 400);

        for (var i = 0; i < targets.length; i++) {
          var t = targets[i];
          if (t.head === hitObj || t.body === hitObj) {
            t.hp -= damage;
            
            // Update 150 HP Bar length
            var pct = Math.max(0, t.hp / t.maxHp);
            t.hpBar.scale.x = pct;

            if (t.hp <= 0) {
              score += isHead ? 100 : 40;
              scoreEl.innerText = score;
              scene.remove(t.group);
              targets.splice(i, 1);
              createBot();
            }
            break;
          }
        }
      }
    }

    var clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      var delta = clock.getDelta();

      if (playing && !shopOpen) {
        if (isFiring) shoot();

        // Player WASD Movement Logic
        var moveSpeed = 8.0 * delta;
        var moveVector = new THREE.Vector3();

        if (moveKeys.forward) moveVector.z -= 1;
        if (moveKeys.backward) moveVector.z += 1;
        if (moveKeys.left) moveVector.x -= 1;
        if (moveKeys.right) moveVector.x += 1;

        moveVector.normalize();
        moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        camera.position.addScaledVector(moveVector, moveSpeed);

        // Player Arena Boundaries
        camera.position.x = Math.max(-15, Math.min(15, camera.position.x));
        camera.position.z = Math.max(-2, Math.min(12, camera.position.z));
        camera.position.y = 0; // Lock vertical feet level

        var targetX = isADS ? 0 : 0.35;
        var targetY = isADS ? -0.15 : -0.32;
        var targetZ = isADS ? -0.35 : -0.6;

        gunGroup.position.x += (targetX - gunGroup.position.x) * 0.2;
        gunGroup.position.y += (targetY - gunGroup.position.y) * 0.2;
        gunGroup.position.z += (targetZ - gunGroup.position.z) * 0.2;

        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Bot movement & health bar billboard rotation
        targets.forEach(function(t) {
          t.group.position.x += t.dir * 3.0 * delta;
          if (t.group.position.x > 11 || t.group.position.x < -11) t.dir *= -1;
          t.hpBar.rotation.y = yaw;
        });
      }

      renderer.render(scene, camera);
    }

    animate();
  })();
  </script>
</body>
</html>
