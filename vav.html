<div style="border:2px solid #ff4655; border-radius:12px; padding:16px; background:#0f1923; text-align:center; color:#fff; font-family:'Segoe UI', sans-serif;">
  <div style="display:inline-block; border:1px solid #ff4655; color:#ff4655; border-radius:6px; padding:2px 10px; font-size:12px; font-weight:bold; letter-spacing:1px;">VALORANT • AIM LAB RANGE</div>
  <h2 style="color:#ff4655; margin:10px 0 4px; border:none; text-transform:uppercase; letter-spacing:1px;">Valorant Aim Trainer 3D</h2>
  <p style="color:#ece8e1; margin:0 0 10px; font-size:12px;">เลื่อนเมาส์เพื่อเล็ง | คลิกซ้าย: ยิง | คลิกขวา: ADS (เล็ง) | ปุ่ม 1, 2, 3: เปลี่ยนปืน | R: รีโหลด</p>
  
  <iframe srcdoc="<body style='margin:0; background:#0f1923; text-align:center; font-family:sans-serif; overflow:hidden; user-select:none;'>
  <div id='hud' style='position:absolute; top:12px; left:0; width:100%; color:#ece8e1; font-size:13px; font-weight:700; pointer-events:none; z-index:10; display:flex; justify-content:space-around; text-shadow:0 0 4px #000;'>
    <div>WEAPON: <span id='wName' style='color:#ff4655;'>VANDAL</span></div>
    <div>AMMO: <span id='ammo' style='color:#00f0ff;'>25</span>/<span id='maxAmmo'>25</span></div>
    <div>SCORE: <span id='score' style='color:#ffb703;'>0</span></div>
  </div>

  <div id='dmgText' style='position:absolute; top:35%; left:50%; transform:translate(-50%, -50%); color:#00f0ff; font-weight:bold; font-size:22px; pointer-events:none; z-index:12; opacity:0; transition:opacity 0.2s;'>HEADSHOT 160</div>

  <div id='crosshair' style='position:absolute; top:50%; left:50%; width:12px; height:12px; margin:-6px 0 0 -6px; pointer-events:none; z-index:11;'>
    <div style='position:absolute; top:5px; left:0; width:4px; height:2px; background:#00ffcc;'></div>
    <div style='position:absolute; top:5px; right:0; width:4px; height:2px; background:#00ffcc;'></div>
    <div style='position:absolute; top:0; left:5px; width:2px; height:4px; background:#00ffcc;'></div>
    <div style='position:absolute; bottom:0; left:5px; width:2px; height:4px; background:#00ffcc;'></div>
  </div>

  <div id='adsOverlay' style='position:absolute; top:0; left:0; width:100%; height:100%; border:2px solid rgba(0,240,255,0.4); box-sizing:border-box; pointer-events:none; z-index:9; opacity:0; transition:opacity 0.15s;'>
    <div style='position:absolute; top:50%; left:0; width:100%; height:1px; background:rgba(0,240,255,0.2);'></div>
    <div style='position:absolute; left:50%; top:0; width:1px; height:100%; background:rgba(0,240,255,0.2);'></div>
  </div>

  <canvas id='c' style='width:100%; height:100%; display:block; cursor:none;'></canvas>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
  <script>
  (function() {
    var canvas = document.getElementById('c');
    var wNameEl = document.getElementById('wName');
    var ammoEl = document.getElementById('ammo');
    var maxAmmoEl = document.getElementById('maxAmmo');
    var scoreEl = document.getElementById('score');
    var dmgText = document.getElementById('dmgText');
    var adsOverlay = document.getElementById('adsOverlay');

    var WEAPONS = {
      1: { name: 'VANDAL', mag: 25, fireRate: 9.75, headDmg: 160, bodyDmg: 40, hasADS: true, zoom: 1.25, color: 0xff4655, modelLen: 0.8 },
      2: { name: 'PHANTOM', mag: 30, fireRate: 11.0, headDmg: 156, bodyDmg: 39, hasADS: true, zoom: 1.25, color: 0x00f0ff, modelLen: 0.75 },
      3: { name: 'SHERIFF', mag: 6, fireRate: 4.0, headDmg: 159, bodyDmg: 55, hasADS: false, zoom: 1.0, color: 0xffb703, modelLen: 0.5 }
    };

    var currentWkey = '1';
    var curW = WEAPONS[currentWkey];
    var ammo = curW.mag;
    var score = 0;
    var isADS = false;
    var lastShotTime = 0;
    var isReloading = false;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1923);
    scene.fog = new THREE.FogExp2(0x0f1923, 0.02);

    var baseFov = 75;
    var camera = new THREE.PerspectiveCamera(baseFov, 340 / 480, 0.1, 1000);
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(340, 480);

    var grid = new THREE.GridHelper(80, 32, 0xff4655, 0x223242);
    grid.position.y = -1.5;
    scene.add(grid);

    var wallGeo = new THREE.PlaneGeometry(60, 20);
    var wallMat = new THREE.MeshBasicMaterial({ color: 0x172431, side: THREE.DoubleSide });
    var wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(0, 8, -25);
    scene.add(wall);

    var lineGeo = new THREE.BoxGeometry(40, 0.1, 0.2);
    var lineMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
    var line10m = new THREE.Mesh(lineGeo, lineMat); line10m.position.set(0, -1.45, -10); scene.add(line10m);
    var line20m = new THREE.Mesh(lineGeo, lineMat); line20m.position.set(0, -1.45, -20); scene.add(line20m);

    var ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    var gunGroup = new THREE.Group();
    var gunMesh, barrelMesh;
    
    function buildGunMesh() {
      if (gunMesh) gunGroup.remove(gunMesh);
      var g = new THREE.Group();
      var bodyGeo = new THREE.BoxGeometry(0.12, 0.18, curW.modelLen);
      var bodyMat = new THREE.MeshBasicMaterial({ color: curW.color, wireframe: true });
      var body = new THREE.Mesh(bodyGeo, bodyMat);

      barrelMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 0.4),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      barrelMesh.rotation.x = Math.PI / 2;
      barrelMesh.position.set(0, 0.04, -curW.modelLen / 2 - 0.2);

      g.add(body);
      g.add(barrelMesh);
      gunMesh = g;
      gunGroup.add(gunMesh);
    }
    
    buildGunMesh();
    gunGroup.position.set(0.3, -0.35, -0.6);
    camera.add(gunGroup);
    scene.add(camera);

    var targets = [];
    function createBot() {
      var botGroup = new THREE.Group();

      var bodyGeo = new THREE.CylinderGeometry(0.4, 0.3, 1.4, 8);
      var bodyMat = new THREE.MeshBasicMaterial({ color: 0x2b3e50 });
      var body = new THREE.Mesh(bodyGeo, bodyMat);
      body.userData = { type: 'body' };
      botGroup.add(body);

      var headGeo = new THREE.SphereGeometry(0.3, 12, 12);
      var headMat = new THREE.MeshBasicMaterial({ color: 0xff4655 });
      var head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.0;
      head.userData = { type: 'head' };
      botGroup.add(head);

      var x = (Math.random() - 0.5) * 16;
      var z = -8 - Math.random() * 14;
      botGroup.position.set(x, 0, z);

      scene.add(botGroup);
      targets.push({ group: botGroup, head: head, body: body, dir: Math.random() > 0.5 ? 1 : -1 });
    }

    for (var i = 0; i < 5; i++) createBot();

    var yaw = 0, pitch = 0;

    // Direct Mouse Tracking (No Pointer Lock required)
    window.addEventListener('mousemove', function(e) {
      var rect = canvas.getBoundingClientRect();
      var mx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      var my = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      
      var sens = isADS ? 0.4 : 0.8;
      yaw = -mx * sens;
      pitch = my * sens;
    });

    document.addEventListener('keydown', function(e) {
      if (['1', '2', '3'].includes(e.key)) {
        currentWkey = e.key;
        curW = WEAPONS[currentWkey];
        ammo = curW.mag;
        wNameEl.innerText = curW.name;
        wNameEl.style.color = '#' + curW.color.toString(16);
        ammoEl.innerText = ammo;
        maxAmmoEl.innerText = curW.mag;
        if (isADS) toggleADS(false);
        buildGunMesh();
      }
      if (e.code === 'KeyR' && !isReloading && ammo < curW.mag) {
        isReloading = true;
        wNameEl.innerText = 'RELOADING...';
        setTimeout(function() {
          ammo = curW.mag;
          ammoEl.innerText = ammo;
          wNameEl.innerText = curW.name;
          isReloading = false;
        }, 1200);
      }
    });

    function toggleADS(state) {
      if (!curW.hasADS && state) return;
      isADS = state;
      adsOverlay.style.opacity = isADS ? '1' : '0';
      camera.fov = isADS ? baseFov / curW.zoom : baseFov;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('mousedown', function(e) {
      if (e.button === 2) {
        toggleADS(!isADS);
      }
    });

    window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    var raycaster = new THREE.Raycaster();
    var isFiring = false;

    window.addEventListener('mousedown', function(e) {
      if (e.button === 0) isFiring = true;
    });
    window.addEventListener('mouseup', function(e) {
      if (e.button === 0) isFiring = false;
    });

    function shoot() {
      var now = performance.now();
      if (now - lastShotTime < (1000 / curW.fireRate)) return;
      if (ammo <= 0 || isReloading) return;

      lastShotTime = now;
      ammo--;
      ammoEl.innerText = ammo;

      gunGroup.position.z = isADS ? -0.3 : -0.4;
      gunGroup.position.y = isADS ? -0.12 : -0.28;

      var spread = isADS ? 0.003 : 0.012;
      var rx = (Math.random() - 0.5) * spread;
      var ry = (Math.random() - 0.5) * spread;

      raycaster.setFromCamera(new THREE.Vector2(rx, ry), camera);

      var clickableObjs = [];
      targets.forEach(function(t) {
        clickableObjs.push(t.head, t.body);
      });

      var hits = raycaster.intersectObjects(clickableObjs);

      if (hits.length > 0) {
        var hitObj = hits[0].object;
        var hitType = hitObj.userData.type;
        var isHead = hitType === 'head';
        var damage = isHead ? curW.headDmg : curW.bodyDmg;

        score += isHead ? 100 : 40;
        scoreEl.innerText = score;

        dmgText.innerText = (isHead ? 'CRITICAL HEADSHOT ' : 'BODY HIT ') + damage;
        dmgText.style.color = isHead ? '#ff4655' : '#00f0ff';
        dmgText.style.opacity = '1';
        setTimeout(function() { dmgText.style.opacity = '0'; }, 400);

        targets.forEach(function(t, idx) {
          if (t.head === hitObj || t.body === hitObj) {
            scene.remove(t.group);
            targets.splice(idx, 1);
            createBot();
          }
        });
      }
    }

    var clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      var delta = clock.getDelta();

      if (isFiring) shoot();

      var targetX = isADS ? 0 : 0.3;
      var targetY = isADS ? -0.15 : -0.35;
      var targetZ = isADS ? -0.35 : -0.6;

      gunGroup.position.x += (targetX - gunGroup.position.x) * 0.2;
      gunGroup.position.y += (targetY - gunGroup.position.y) * 0.2;
      gunGroup.position.z += (targetZ - gunGroup.position.z) * 0.2;

      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      targets.forEach(function(t) {
        t.group.position.x += t.dir * 2.5 * delta;
        if (t.group.position.x > 8 || t.group.position.x < -8) {
          t.dir *= -1;
        }
      });

      renderer.render(scene, camera);
    }

    animate();
  })();
  </script>
</body>" style="width:100%; max-width:340px; height:490px; border:0; display:block; margin:0 auto;"></iframe>
</div>
